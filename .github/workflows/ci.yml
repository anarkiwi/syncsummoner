name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: lint
          load: false
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          build-args: PYTHON_VERSION=${{ matrix.python-version }}
          load: true
          tags: syncsummoner-test:${{ matrix.python-version }}
          cache-from: type=gha,scope=test-${{ matrix.python-version }}
          cache-to: type=gha,mode=max,scope=test-${{ matrix.python-version }}
      - run: docker run --rm syncsummoner-test:${{ matrix.python-version }}

  # The rig runs the image as the invoking user, who owns neither /venv nor the
  # home that gets mounted over; librosa's cached jits still need somewhere to go.
  runtime-nonroot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: syncsummoner:ci
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - run: |
          docker run --rm --user 1234:1234 -e HOME=/nonexistent \
            --entrypoint /venv/bin/python syncsummoner:ci -c '
          import numpy as np, librosa
          sr = 22050
          y = (0.3 * np.sin(2 * np.pi * 220 * np.arange(sr) / sr)).astype("float32")
          assert librosa.onset.onset_strength(y=y, sr=sr).size
          '

  # Early warning that the aesthetics extraction seam has leaked.
  aesthetics-seam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: test-aesthetics
          load: true
          tags: syncsummoner-aesthetics:latest
          cache-from: type=gha,scope=aesthetics
          cache-to: type=gha,mode=max,scope=aesthetics
      - run: docker run --rm syncsummoner-aesthetics:latest
